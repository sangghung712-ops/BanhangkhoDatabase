{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="login-box">
    <h1>Đăng ký tài khoản</h1>

    {% if loi %}
        <p class="error">{{ loi }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.register') }}">
        <label for="username">Tên đăng nhập *</label>
        <input type="text" id="username" name="username" required autofocus
               maxlength="100" value="{{ form.get('username', '') }}">

        <label for="password">Mật khẩu *</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm_password">Nhập lại mật khẩu *</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <label for="name">Họ và tên *</label>
        <input type="text" id="name" name="name" required
               maxlength="100" value="{{ form.get('name', '') }}">

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required
               maxlength="100" value="{{ form.get('email', '') }}">

        <label for="phone">Số điện thoại *</label>
        <input type="tel" id="phone" name="phone" required
               pattern="0[0-9]{9}" maxlength="10"
               title="Gồm 10 chữ số, bắt đầu bằng 0"
               value="{{ form.get('phone', '') }}">

        <label for="address">Địa chỉ (có thể bổ sung sau)</label>
        <input type="text" id="address" name="address"
               maxlength="255" value="{{ form.get('address', '') }}">

        <button type="submit">Đăng ký</button>
    </form>

    <a class="btn-secondary" href="{{ url_for('auth.login') }}">Quay lại đăng nhập</a>
</div>
{% endblock %}
