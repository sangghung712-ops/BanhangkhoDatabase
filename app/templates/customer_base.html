{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/shop.css') }}">{% endblock %}

{% block nav %}
<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" href="{{ url_for('customer.shop') }}">Cửa hàng</a>
        <div class="nav-links">
            <a class="nav-link {{ 'active' if request.endpoint == 'customer.shop' }}"
               href="{{ url_for('customer.shop') }}">Sản phẩm</a>
            <a class="nav-link {{ 'active' if request.endpoint in ('customer.cart', 'customer.checkout') }}"
               href="{{ url_for('customer.cart') }}">Giỏ hàng{% if cart_count %}<span class="count">{{ cart_count }}</span>{% endif %}</a>
            <a class="nav-link {{ 'active' if request.endpoint in ('customer.my_orders', 'customer.order_detail') }}"
               href="{{ url_for('customer.my_orders') }}">Đơn hàng của tôi</a>
        </div>
        <div class="nav-user">
            <span>Xin chào, <strong>{{ session.get('username') }}</strong></span>
            <a class="btn btn-secondary btn-sm" href="{{ url_for('auth.logout') }}">Đăng xuất</a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<main class="container">
    {% block page %}{% endblock %}
</main>
{% endblock %}
