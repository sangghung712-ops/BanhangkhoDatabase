{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">{% endblock %}

{% block nav %}
<nav class="navbar navbar-dark">
    <div class="navbar-inner">
        <a class="brand" href="{{ url_for('admin.dashboard') }}">Quản trị</a>
        <div class="nav-links">
            <a class="nav-link {{ 'active' if request.endpoint == 'admin.dashboard' }}"
               href="{{ url_for('admin.dashboard') }}">Tổng quan</a>
            <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin.product') }}"
               href="{{ url_for('admin.products') }}">Sản phẩm</a>
            <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin.order') }}"
               href="{{ url_for('admin.orders') }}">Đơn hàng</a>
        </div>
        <div class="nav-user">
            <span>{{ session.get('username') }}</span>
            <a class="btn btn-secondary btn-sm" href="{{ url_for('auth.logout') }}">Đăng xuất</a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<main class="container">
    {% block page %}{% endblock %}
</main>
{% endblock %}
