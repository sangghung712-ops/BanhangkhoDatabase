{% extends "base.html" %}

{% block content %}
<style>
    .adm-nav { display: flex; align-items: center; gap: 4px; padding: 0 20px;
               background: #111827; color: #fff; flex-wrap: wrap; }
    .adm-nav a { color: #d1d5db; text-decoration: none; padding: 14px 14px; }
    .adm-nav a:hover { color: #fff; }
    .adm-nav a.active { color: #fff; border-bottom: 3px solid #3b82f6; }
    .adm-nav .brand { font-weight: 700; color: #fff; margin-right: 12px; }
    .adm-nav .sp { margin-left: auto; color: #9ca3af; padding-right: 8px; }
    .adm-wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .adm-card { background: #fff; color: #222; border: 1px solid #ddd;
                border-radius: 8px; padding: 16px; margin-bottom: 18px; }
    .adm-table { width: 100%; border-collapse: collapse; }
    .adm-table th, .adm-table td { padding: 9px 10px; border-bottom: 1px solid #e5e7eb;
                                   text-align: left; vertical-align: middle; }
    .adm-table th { background: #f3f4f6; font-size: 13px; }
    .adm-table .num { text-align: right; }
    .adm-btn { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
               padding: 6px 12px; cursor: pointer; text-decoration: none;
               display: inline-block; font-size: 14px; }
    .adm-btn.gray { background: #6b7280; }
    .adm-btn.red { background: #dc2626; }
    .adm-btn.green { background: #16a34a; }
    .adm-btn.sm { padding: 4px 9px; font-size: 13px; }
    .adm-input { padding: 7px; border: 1px solid #ccc; border-radius: 6px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 10px;
             font-size: 12px; color: #fff; background: #6b7280; }
    .badge.Pending { background: #f59e0b; } .badge.Confirmed { background: #3b82f6; }
    .badge.Shipping { background: #8b5cf6; } .badge.Completed { background: #16a34a; }
    .badge.Cancelled { background: #dc2626; } .badge.Inactive { background: #9ca3af; }
    .badge.Active { background: #16a34a; }
    .inline { display: inline-flex; gap: 4px; align-items: center; margin: 0; }
</style>

<nav class="adm-nav">
    <span class="brand">Quản trị</span>
    <a href="{{ url_for('admin.dashboard') }}"
       class="{{ 'active' if request.endpoint == 'admin.dashboard' }}">Tổng quan</a>
    <a href="{{ url_for('admin.products') }}"
       class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin.product') }}">Sản phẩm</a>
    <a href="{{ url_for('admin.orders') }}"
       class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin.order') }}">Đơn hàng</a>
    <span class="sp">{{ session.get('username') }}</span>
    <a href="{{ url_for('auth.logout') }}">Đăng xuất</a>
</nav>

<div class="adm-wrap">
    {% block page %}{% endblock %}
</div>
{% endblock %}
